name: Publish to npm

# Fallback publisher: on every push to main, publishes the version in
# package.json to npm (OIDC trusted publishing) when it is numerically
# ahead of the version currently on npm. The Trigger release workflow
# normally handles version bumps, so this job only ever covers a manual
# version edit committed directly to main.
on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Ensure latest npm (required for OIDC)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Build Production package
        run: npm run deploy

      - name: Publish outstanding version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          LATEST=$(npm view "$NAME" version 2>/dev/null || echo "0.0.0")
          # Numerical (not lexicographic) semver comparison so 3.10.0 > 3.9.0
          AHEAD=$(node -e 'const p=v=>v.replace(/-.*$/,"").split(".").map(Number);const [a,b]=process.argv.slice(1);console.log((a[0]-b[0])||(a[1]-b[1])||(a[2]-b[2]))' "$LOCAL" "$LATEST")
          if [ "$AHEAD" -gt 0 ]; then
            echo "Local $LOCAL is ahead of npm $LATEST - publishing"
            npm publish --provenance --access public
          else
            echo "Local $LOCAL not ahead of npm $LATEST - nothing to publish"
          fi
