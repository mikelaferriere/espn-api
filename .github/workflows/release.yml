name: Create Versioning PR

# Optional: when a changeset lands on main (by hand, or pushed by the
# Auto patch changeset workflow after a merge) this opens a "Version
# Packages" PR. Merging it is NOT required for releases - the Trigger
# release workflow versions and publishes any pending changesets on the
# next push to main, so you can close this PR without effect.
on:
  push:
    paths:
      - '.changeset/**'
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Create Versioning PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'Version Packages'
          skip: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
