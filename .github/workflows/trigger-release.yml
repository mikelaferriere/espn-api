name: Trigger release

# Option B: trigger a version bump and npm publish from the Actions UI
# (Actions > Trigger release > Run workflow > main).
#
# Also the single release pipeline for main: when changesets are already
# present in the tree (added by Option A or by hand), any push to main
# version-bumps them - no manual "Version Packages" PR merge is required.
#
# Branch protection on main requires "Changes must be made through a
# pull request", so the version bump is NEVER pushed directly to main.
# Instead this workflow:
#   1. builds + tests
#   2. runs `changeset version` locally
#   3. commits the bump to a throwaway branch and pushes it
#   4. opens a "Version Packages" PR against main and enables auto-merge
#   5. waits for the PR to merge
#
# The merge of the version PR is itself a push to main, which re-runs this
# workflow as a no-op (the changesets were consumed by `changeset version`)
# and runs the "Publish to npm" workflow, which publishes the new version
# to npm, creates the v{version} tag and the GitHub Release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump to release'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - main

permissions:
  contents: write # push the version branch
  pull-requests: write # open the version PR + enable auto-merge

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: 0 # Disable git hooks in CI

jobs:
  release:
    name: Version and open PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run deploy

      - name: Test
        run: npm test

      - name: Create changeset from dispatch input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          echo "Creating ${{ inputs.bump }} changeset..."
          printf -- "---\n'@mikelaferriere/espn-api': ${{ inputs.bump }}\n---\n\nTriggered release (${{ inputs.bump }}) from the Actions UI.\n" > .changeset/triggered-release.md
          echo 'Created .changeset/triggered-release.md'

      - name: Check for changesets
        id: changesets
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit 2>/dev/null)" ]; then
            echo 'HAS_CHANGESTS=true' >> "$GITHUB_OUTPUT"
            echo "Changesets present:"
            find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md'
          else
            echo 'HAS_CHANGESTS=false' >> "$GITHUB_OUTPUT"
            echo 'No changesets - nothing to release'
          fi

      - name: Version packages
        if: steps.changesets.outputs.HAS_CHANGESTS == 'true'
        run: npx changeset version

      - name: Push version bump to a branch
        if: steps.changesets.outputs.HAS_CHANGESTS == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="release/version-bump-${GITHUB_RUN_ID}-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json CHANGELOG.md .changeset/
          git commit -m 'Version Packages'
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "Pushed version bump to branch $BRANCH"

      - name: Open version PR and enable auto-merge
        id: pr
        if: steps.changesets.outputs.HAS_CHANGESTS == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_URL=$(gh pr create \
            --title 'Version Packages' \
            --body 'Version bump from the Trigger release workflow. Merging this PR (auto-merge is enabled) publishes the new version to npm and creates the git tag and GitHub Release.' \
            --base main \
            --head "$BRANCH")
          PR_NUMBER=${PR_URL##*/}
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
          echo "Auto-merge enabled for PR #$PR_NUMBER"

      - name: Wait for version PR to merge
        if: steps.changesets.outputs.HAS_CHANGESTS == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.PR_NUMBER }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            STATE=$(gh pr view "$PR_NUMBER" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "Version PR #$PR_NUMBER merged - the Publish to npm workflow will now publish, tag, and create the release"
              exit 0
            fi
            echo "Attempt $i/20: PR state = $STATE - waiting 30s"
            sleep 30
          done
          echo "::error::Version PR #$PR_NUMBER was not merged within 10 minutes. Check the PR; the release publishes once it merges."
          exit 1
